<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco-Cultural Heritage App</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 19c3-4 6-6 9-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span data-i18n="title">Eco-Cultural Heritage App</span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="/" aria-current="page" data-i18n="navHome"></a>
          <a href="/gallery.html" data-i18n="navGallery"></a>
        </nav>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="lang-bg" data-lang="bg">BG</button>
          <button type="button" id="lang-en" data-lang="en">EN</button>
        </div>
      </header>

      <section id="hero" class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" data-i18n="heroTitleHome"></h1>
        <blockquote class="hero-quote">
          <p id="hero-quote"></p>
          <p id="hero-original" class="hero-original" lang="en" hidden></p>
          <footer id="hero-author"></footer>
        </blockquote>
        <a id="hero-credit" class="hero-credit" href="#" hidden></a>
      </section>

      <form id="search-form">
        <input id="place" type="text" data-i18n-placeholder="placePlaceholder" />
        <input id="q" type="text" data-i18n-placeholder="searchPlaceholder" />
        <label><input id="eco" type="checkbox" /> <span data-i18n="ecoOnly"></span></label>
        <label><input id="show-places" type="checkbox" checked /> <span data-i18n="placesToggle"></span></label>
        <button type="submit" data-i18n="search"></button>
      </form>
      <div id="place-info" class="place-info"></div>

      <details class="filters" open>
        <summary data-i18n="filters"></summary>
        <div class="filter-grid">
          <label>
            <span data-i18n="category"></span>
            <select id="category">
              <option value="" data-i18n="allCategories"></option>
              <option value="archaeology" data-i18n="cat_archaeology"></option>
              <option value="architecture" data-i18n="cat_architecture"></option>
              <option value="history" data-i18n="cat_history"></option>
              <option value="politics" data-i18n="cat_politics"></option>
              <option value="religion" data-i18n="cat_religion"></option>
              <option value="folklore" data-i18n="cat_folklore"></option>
              <option value="photography" data-i18n="cat_photography"></option>
              <option value="maps" data-i18n="cat_maps"></option>
            </select>
          </label>
          <label>
            <span data-i18n="materialType"></span>
            <select id="type">
              <option value="" data-i18n="allTypes"></option>
              <option value="IMAGE" data-i18n="type_IMAGE"></option>
              <option value="TEXT" data-i18n="type_TEXT"></option>
              <option value="SOUND" data-i18n="type_SOUND"></option>
              <option value="VIDEO" data-i18n="type_VIDEO"></option>
              <option value="3D" data-i18n="type_3D"></option>
            </select>
          </label>
          <label>
            <span data-i18n="country"></span>
            <select id="country"></select>
          </label>
          <label>
            <span data-i18n="yearFrom"></span>
            <input id="year-from" type="number" min="-3000" max="2100" step="1" />
          </label>
          <label>
            <span data-i18n="yearTo"></span>
            <input id="year-to" type="number" min="-3000" max="2100" step="1" />
          </label>
          <label class="check">
            <input id="reusable" type="checkbox" />
            <span data-i18n="reusableOnly"></span>
          </label>
          <button type="button" id="clear-filters" data-i18n="clearFilters"></button>
        </div>
      </details>

      <p id="status" role="status"></p>

      <section id="nearby">
        <h2 data-i18n="nearMeTitle"></h2>
        <div class="controls">
          <button id="locate" type="button" data-i18n="locate"></button>
          <label>
            <span data-i18n="radius"></span>
            <select id="radius"></select>
          </label>
          <button id="search-area" type="button" data-i18n="searchArea"></button>
        </div>
        <p id="map-status" role="status"></p>
        <p class="legend">
          <span class="dot dot-eu"></span> <span data-i18n="legendEuropeana"></span>
          <span class="dot dot-pl"></span> <span data-i18n="legendPlaces"></span>
        </p>
        <div id="map"></div>
      </section>

      <section id="places-section">
        <h2 data-i18n="placesTitle"></h2>
        <p id="places-status" role="status"></p>
        <div id="places" class="cards"></div>
        <div id="places-more" class="pager"></div>
        <small data-i18n="placesSource"></small>
      </section>

      <h2 id="results-title" data-i18n="europeanaTitle"></h2>
      <div id="results"></div>
      <div id="pager" class="pager"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
